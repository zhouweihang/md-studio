name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Type check
        run: bun run typecheck

      - name: Production build
        run: bun run build

  rust:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The Tauri codegen embeds the frontend dist.
      - name: Build frontend for Tauri codegen
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Cargo tests
        run: cargo test --locked --all-targets

  docs:
    name: Documentation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check RFC / ADR / C4 / spec / plan / backlog
        run: node scripts/check-eng-docs.cjs
