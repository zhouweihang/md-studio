name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        include:
          # NSIS installer + MSI.
          - label: windows-x64
            os: windows-latest
            args: ''
          # AppImage + deb. Built on 22.04 on purpose: Tauri needs webkit2gtk
          # 4.1, and an older glibc keeps the artifacts usable on 22.04+.
          - label: linux-x64
            os: ubuntu-22.04
            args: --bundles deb,appimage
          # Apple Silicon and Intel run on separate native runners; cross
          # building macOS bundles is not possible.
          - label: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - label: macos-x64
            os: macos-15-intel
            args: --target x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      # The repo pins the Windows MSVC toolchain; other hosts must resolve
      # their own default or rustup rejects the target triple.
      - name: Use the host toolchain outside Windows
        if: runner.os != 'Windows'
        run: rm -f rust-toolchain.toml

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libfuse2

      # tauri-action drives `tauri build` (which runs the frontend build via
      # beforeBuildCommand) and, on tag pushes, uploads the bundles to one
      # draft release. On workflow_dispatch it only builds.
      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('MD Studio {0}', github.ref_name) || '' }}
          releaseBody: |
            Local-first Markdown notes for Windows, macOS and Linux.

            - **Windows**: `MD Studio_<version>_x64-setup.exe` (NSIS) or the `.msi`
            - **macOS**: `.dmg` for Apple Silicon (`aarch64`) and Intel (`x64`).
              The app is unsigned, so the first launch needs right-click → Open
              (or `xattr -dr com.apple.quarantine "/Applications/MD Studio.app"`).
            - **Linux**: `.deb` (Ubuntu 22.04+) or portable `.AppImage`
              (needs webkit2gtk 4.1 from the distribution).

            The Windows installer is unsigned as well, so SmartScreen reports an
            unknown publisher.

            ## What is in this release

            - Open any folder as a workspace, browse Markdown files in a virtualized tree (50k notes stay responsive).
            - Full-text search over note bodies with match highlighting and line jumps, streamed in batches and cancellable.
            - Source editing plus GFM preview sanitized with DOMPurify.
            - Debounced autosave, `Ctrl+S`, flush before switching notes or closing, revision-checked writes with a conflict banner.
            - Rename, delete to the system trash with an undo toast.
            - A filesystem watcher keeps the search snapshot and the tree in sync with Typora / VS Code / Git edits.
          releaseDraft: true
          prerelease: false

      - name: Upload bundles for this run
        uses: actions/upload-artifact@v4
        with:
          name: md-studio-${{ matrix.label }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
